<style>
:root{--bg:#eeece7;--ink:#15140f;--mut:#6b6860;--sun:#e0b43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;overflow-x:hidden}
#track{height:420vh;position:relative}
#stage{position:sticky;top:0;height:100vh;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{position:absolute;top:42%;width:min(24vw,300px);font-size:15px;z-index:2}
.side h2{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
#bio{left:28px}#comms{right:28px;text-align:right}
#bio p{font-size:13.5px;line-height:1.6;margin-bottom:12px}#bio b{font-weight:700}#bio a{text-underline-offset:3px}#bio small{font-size:13.5px;color:var(--mut);line-height:1.5;display:block}
a{color:inherit}
#comms a{display:block;font-size:19px;text-decoration:none;padding:2px 0;transition:transform .2s}
#comms a:hover{text-decoration:underline;transform:translateX(-6px)}
#foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
#cta{position:absolute;left:0;top:0;z-index:3;display:flex;gap:4px;align-items:center;font:500 14px Outfit,sans-serif;color:#fff;text-decoration:none;white-space:nowrap}
#cta span{background:#4a4a4a;padding:10px 16px;border-radius:10px}

#pop{position:absolute;left:0;top:0;z-index:3;pointer-events:none;background:#fff;color:#161616;font:600 14px Outfit,sans-serif;padding:8px 14px;border-radius:16px 16px 16px 4px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}

@keyframes pop{from{scale:.5}}
#work{position:relative;background:var(--bg);padding:12vh 28px 10vh}
#work h1{font-size:clamp(34px,6vw,80px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:5vh}
#cats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8vh 0 3vh;font-size:20px}
#cats button{all:unset;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}
#cats button:focus-visible{outline:2px solid var(--sun)}
#cats button.on{color:var(--ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.p{position:relative;aspect-ratio:4/3.4;overflow:hidden;border-radius:6px;color:#fff}
.p .art{position:absolute;inset:0;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.p:hover .art{transform:scale(1.05)}
.p .t{position:absolute;left:16px;bottom:14px;font-weight:600;font-size:18px;transition:opacity .2s}
.p .m{position:absolute;inset:auto 0 0 0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.65));transform:translateY(100%);transition:transform .35s}
.p:hover .m,.p:focus-within .m{transform:none}.p:hover .t{opacity:0}
.m em{font-style:normal;opacity:.7;display:block;font-size:11px}
.m div:last-child{grid-column:1/-1}
footer{padding:6vh 28px 5vh;display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
@media(max-width:760px){.side{width:42vw;top:auto;bottom:9vh;font-size:13px}#comms a{font-size:15px}#bio p,#bio small{font-size:12px}#bio{left:14px}#comms{right:14px}.grid{grid-template-columns:1fr}#work{padding:10vh 14px}}

:root{--ash:#c9c9c5;--ash2:#aeaea9;--or:#ee5a24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ash:#3a3a3c;--ash2:#505053}}
#cats{margin:0 0 3vh}
.p{display:block;text-decoration:none}.art svg,.dh svg,.dg svg,.dn svg{width:100%;height:100%;display:block}
#globe{position:relative;padding:12vh 28px 6vh;overflow:hidden;min-height:110vh}

.gc{font-size:20px;white-space:nowrap}.gc em{display:block;font-style:normal;color:var(--mut);font-size:14px}
#mapwrap{position:relative;z-index:1;margin-top:6vh}#map{width:100%;height:auto;display:block}
#map path{fill:var(--ash);stroke:var(--bg);stroke-width:.5;transition:fill .2s;animation:fi .9s both;animation-delay:calc(var(--i)*8ms)}
@keyframes fi{from{opacity:0}}
#map path:hover{fill:var(--ash2)}#map path.hl{fill:var(--or)}#map path.hl:hover{fill:#ff7a45}

#detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .6s cubic-bezier(.7,0,.2,1),visibility 0s .6s}

.dh{aspect-ratio:16/8;margin:0 28px;border-radius:6px;overflow:hidden}

.dst{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 28px 8vh;color:var(--mut)}.dst b{display:block;font-size:clamp(40px,7vw,96px);letter-spacing:-.04em;color:var(--ink);line-height:1}
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;padding:0 28px 10vh}.dg>div{aspect-ratio:4/3.4;border-radius:6px;overflow:hidden}
.dn{display:block;text-decoration:none;margin:0 28px 6vh;border-top:1px solid var(--mut);padding-top:20px;position:relative}.dn em{display:block;color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.dn span{font-size:clamp(34px,7vw,100px);font-weight:800;letter-spacing:-.04em;line-height:1;display:block;margin-bottom:20px}.dn>div{aspect-ratio:16/6;border-radius:6px;overflow:hidden;transition:transform .5s}.dn:hover>div{transform:scale(.985)}

.bm{display:none}

#stage{height:100vh;height:100svh}

 #foot{display:none}.mo{display:none}

 #bio h2{margin-bottom:8px}
 #bio .bm{display:block;font-size:clamp(25px,7.3vw,36px);line-height:1.12;font-weight:500;letter-spacing:-.025em;max-width:none;margin:0;color:var(--ink)}
 #bio .bm b{font-weight:800}#bio .bm a{text-decoration-thickness:2px;text-underline-offset:4px}
 .acts{border-top:0;margin-top:16px;padding-top:0;gap:6px 18px}.acts a{font-size:15px;font-weight:500;color:var(--ink);border-bottom:1.5px solid var(--mut);padding-bottom:1px}
}

#pfp{width:68px;height:50px;border-radius:18px;overflow:hidden;display:block;border:2px solid rgba(255,255,255,.6);box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .15s}#pfp:active{transform:scale(.95)}#pfp svg{width:100%;height:100%;display:block}

.soc{display:flex;gap:10px;margin-top:12px;pointer-events:auto}

.soc a:hover{transform:translateY(-3px) scale(1.05)}.soc svg{width:22px;height:22px}
:root[data-theme="dark"] .soc a{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04)),color-mix(in srgb,var(--c) 18%,transparent);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .soc a{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04)),color-mix(in srgb,var(--c) 18%,transparent);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4)}}
.ab{display:grid;grid-template-columns:1fr 2fr;gap:28px;padding:4vh 28px 10vh}.av{aspect-ratio:4/5;border-radius:24px;overflow:hidden}.av svg{width:100%;height:100%;display:block}
.ab .lead{font-size:clamp(22px,3vw,38px);line-height:1.25;margin-bottom:24px}.ab p{color:var(--mut);font-size:17px;line-height:1.6;margin-bottom:16px}.ab .lead{color:var(--ink)}
.ak{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:28px 0}.ak em{display:block;color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
